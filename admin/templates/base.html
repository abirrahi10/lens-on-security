<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#23251e">
    <link rel="icon" href="{{ url_for('static', filename='admin-favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='admin-favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='admin-favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='admin-apple-touch-icon.png') }}">
    <title>{% block title %}Lens Publisher{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('dashboard') }}">Lens <span>Publisher</span></a>
      <nav class="private-nav" aria-label="Private editors">
        <span>Private</span><span aria-hidden="true">·</span>
        <a href="{{ url_for('edit_about') }}">About</a><span aria-hidden="true">·</span>
        <a href="{{ url_for('edit_reading') }}">Reading</a>
      </nav>
    </header>
    <main class="shell">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
